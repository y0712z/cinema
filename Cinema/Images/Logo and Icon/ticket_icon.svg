<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 80 240 200" width="480" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- ticket outline with notched left and right ends -->
    <path id="ticket" d="M-85 -45 H85
      v2 a7 7 0 0 0 0 14 v2
      v2 a7 7 0 0 0 0 14 v2
      v2 a7 7 0 0 0 0 14 v2
      v2 a7 7 0 0 0 0 14 v2
      v2 a7 7 0 0 0 0 14 v2
      H-85
      v-2 a7 7 0 0 0 0 -14 v-2
      v-2 a7 7 0 0 0 0 -14 v-2
      v-2 a7 7 0 0 0 0 -14 v-2
      v-2 a7 7 0 0 0 0 -14 v-2
      v-2 a7 7 0 0 0 0 -14 v-2 Z"/>

    <polygon id="star" points="0,-6.5 1.6,-2.2 6.2,-2 2.6,0.85 3.8,5.25 0,2.7 -3.8,5.25 -2.6,0.85 -6.2,-2 -1.6,-2.2"/>

    <!-- hides the part of the back ticket that is behind the front one -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="white"/>
      <use href="#ticket" transform="translate(125 183) rotate(-40)" fill="black" stroke="black" stroke-width="19" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g fill="none" stroke="#222222" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back ticket -->
    <g mask="url(#cut)">
      <use href="#ticket" transform="translate(154.6 192.7) rotate(-23)"/>
    </g>

    <!-- front ticket -->
    <g transform="translate(125 183) rotate(-40)">
      <use href="#ticket"/>

      <!-- perforation dots -->
      <path d="M48 -37 V37" stroke-dasharray="0 9" stroke-width="5.5"/>

      <!-- stars -->
      <g fill="#222222" stroke="none">
        <use href="#star" x="-55" y="-23"/>
        <use href="#star" x="-41" y="-23"/>
        <use href="#star" x="-27" y="-23"/>
      </g>

      <!-- TICKET -->
      <g stroke-width="3.8" stroke-linejoin="miter" stroke-linecap="butt">
        <path d="M-60 -7 h9 M-55.5 -7 v14"/>
        <path d="M-40.5 -7 v14"/>
        <path d="M-21 -5 L-23 -7 H-28 L-30 -5 V5 L-28 7 H-23 L-21 5"/>
        <path d="M-15 -7 V7 M-6 -7 L-15 1 M-12 -2 L-6 7"/>
        <path d="M9 -7 H0 V7 H9 M0 0 H7"/>
        <path d="M15 -7 h9 M19.5 -7 v14"/>
      </g>

      <!-- lines under the text -->
      <path d="M-60 18 H25" stroke-width="4.5"/>
      <path d="M-60 27 H5" stroke-width="4.5"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
