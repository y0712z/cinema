        <!-- theme toggle for desktop -->

            aria-label="Toggle dark/light mode"></button>

               <a href="contact.html" class="signupbox signup">SIGN UP</a>
    </header>

    <!--menu navigation-->
    <nav class="sidebar" id="sidebar">
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="movies.html">MOVIES</a></li>
            <li><a href="halls.html">OUR HALLS</a></li> 
            <li><a href="food.html">FOOD & DRINKS</a></li>
            <li><a href="team.html">OUR TEAM</a></li>
            <li><a href="orders.html">YOUR ORDERS</a></li>
            <div class="theme-container">
                <li><p class="theme-label">THEME: </p></li>
                <li><button class="theme-toggle" type="button" 
                aria-label="Toggle dark/light mode"></button></li>
            </div>
        </ul> 
    </nav>
    
    <!--navigation bar-->
     <nav class="navbar">
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="movies.html">MOVIES</a></li>

    <hr>


        <!-- search bar-->
        <div class="search-row">
            <input id="search" type="search" placeholder="Search movies">
            <button id="filter-button" onclick="toggleFilterPanel()"></button>
        </div>         
        
        <!-- filter box -->
        <div id="filter-panel" class="panel">

    <h4>LANGUAGE</h4>
    <div class="filter-options">
        <button class="filter-btn" onclick="toggleChoice('language', 'English', this)">English</button>
        <button class="filter-btn" onclick="toggleChoice('language', 'Malay', this)">Malay</button>
        <button class="filter-btn" onclick="toggleChoice('language', 'Mandarin', this)">Mandarin</button>
        <button class="filter-btn" onclick="toggleChoice('language', 'Tamil', this)">Tamil</button>
        <button class="filter-btn" onclick="toggleChoice('language', 'Japanese', this)">Japanese</button>
    </div>

    <h4>AGE RATING</h4>
    <div class="filter-options">
        <button class="filter-btn" onclick="toggleChoice('age', 'U', this)">U</button>
        <button class="filter-btn" onclick="toggleChoice('age', 'P13', this)">P13</button>
        <button class="filter-btn" onclick="toggleChoice('age', '18', this)">18</button>
    </div>

    <h4>SORT BY</h4>
    <div class="filter-options">
        <button id="sort-rating" class="filter-btn selected" onclick="chooseSort('rating')">Top rated</button>
        <button id="sort-az" class="filter-btn" onclick="chooseSort('az')">A to Z</button>
    </div>

    <div class="panel-bottom">
        <span>U all ages · P13 parental guidance · 18 adults only</span>
        <button class="clear-btn" onclick="clearFilters()">Clear all</button>
    </div>

</div>

        <!--navigation bar-->
        <div class="container">
                    <a class="halls_choice" href="#" data-filter="dolby">
                        <img src = "../Images/Logo and Icon/dolby_logo.svg" 
                        alt = "Dolby Logo">
                    </a>
                    <a class="halls_choice" href="#" data-filter="junior">
                        <img src = "../Images/Logo and Icon/junior_logo.svg" 
                        alt = "Junior logo">
                    </a>
                    <a class="halls_choice" href="#" data-filter="imax">
                        <img src = "../Images/Logo and Icon/imax_logo.svg" 
                        alt = "IMAX Logo">
                    </a>
                    <a class="halls_choice" href="#" data-filter="screenx">
                        <img src = "../Images/Logo and Icon/screenx_logo.svg" 
                        alt = "SCREEN X Logo">
                    </a>
                
        </div>

        </div>

        

        
        <!-- movie gallery-->
        <div id="grid"></div>

        <div id="grid_soon"></div>

    </div>
